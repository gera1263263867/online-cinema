name: online-cinema
x-app: &app
  build: .
  image: online-cinema-app:local
  init: true
x-kafka: &kafka
  image: apache/kafka:3.9.1
  restart: unless-stopped
  healthcheck:
    test: [CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, 'localhost:9092']
    interval: 10s
    timeout: 10s
    retries: 18
x-kafka-environment: &kafka-environment
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
services:
  kafka:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
    volumes:
      - kafka3-data:/var/lib/kafka/data

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema_local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - '127.0.0.1:8123:8123'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: [CMD, clickhouse-client, --user, cinema, --password, cinema_local, --query, 'SELECT 1']
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema_local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, cinema, -d, cinema]
      interval: 5s
      timeout: 5s
      retries: 20

  registry:
    image: confluentinc/cp-schema-registry:7.8.3
    restart: unless-stopped
    depends_on:
      kafka: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    environment:
      SCHEMA_REGISTRY_HOST_NAME: registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092,PLAINTEXT://kafka2:9092,PLAINTEXT://kafka3:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx384m
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8081/subjects]
      interval: 5s
      timeout: 5s
      retries: 30

  bootstrap:
    <<: *app
    command: [python, bootstrap.py]
    depends_on:
      registry: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      postgres: {condition: service_healthy}

  producer:
    <<: *app
    command: [uvicorn, 'producer:app', --host, 0.0.0.0, --port, '8000']
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    ports: ['127.0.0.1:8000:8000']
    healthcheck: &api-health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  generator:
    <<: *app
    command: [python, producer.py]
    restart: unless-stopped
    depends_on:
      producer: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; assert time.time()-pathlib.Path('/tmp/generator-heartbeat').stat().st_mtime < 90"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 45s

  aggregation:
    <<: *app
    command: [uvicorn, 'aggregation:app', --host, 0.0.0.0, --port, '8000']
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    ports: ['127.0.0.1:8001:8000']
    environment:
      AGGREGATION_INTERVAL: ${AGGREGATION_INTERVAL:-120}
    healthcheck: *api-health

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: cinema_local
      MINIO_ROOT_PASSWORD: cinema_local_password
    ports: ['127.0.0.1:9001:9001']
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20

  exporter:
    <<: *app
    command: [uvicorn, 'exporter:app', --host, 0.0.0.0, --port, '8000']
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
    ports: ['127.0.0.1:8002:8000']
    environment:
      AWS_ACCESS_KEY_ID: cinema_local
      AWS_SECRET_ACCESS_KEY: cinema_local_password
      EXPORT_INTERVAL: ${EXPORT_INTERVAL:-300}
    healthcheck: *api-health

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.24.0
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:3000/api/health]
      interval: 5s
      timeout: 5s
      retries: 30

  test:
    <<: *app
    profiles: [test]
    command: [python, integration_test.py]
    depends_on:
      producer: {condition: service_healthy}

volumes:
  kafka-data:
  kafka2-data:
  kafka3-data:
  clickhouse-data:
  postgres-data:
  minio-data:
